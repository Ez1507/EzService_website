backend:
  name: github
  repo: Ez1507/EzService_website
  branch: main
  base_url: https://ezservice-oauth.hoangdeb751.workers.dev
  auth_endpoint: auth

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: vi

collections:
  - name: "settings"
    label: "⚙️ Cài đặt chung (SĐT, Email)"
    files:
      - name: "settings"
        label: "Thông tin liên hệ & Thương hiệu"
        file: "content/settings.json"
        fields:
          - { label: "Tên thương hiệu", name: "brand_name", widget: "string" }
          - { label: "Slogan", name: "tagline", widget: "string" }
          - { label: "Hotline (hiển thị)", name: "hotline", widget: "string", hint: "Ví dụ: 0938 267 586" }
          - { label: "Hotline (dạng gọi được)", name: "hotline_raw", widget: "string", hint: "Ví dụ: 0938267586 (không dấu cách)" }
          - { label: "Số Zalo", name: "zalo", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Địa chỉ / Ghi chú", name: "address", widget: "string" }
          - { label: "Mô tả footer", name: "footer_description", widget: "text" }
          - label: "Số liệu uy tín"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Số", name: "number", widget: "string" }
              - { label: "Nhãn", name: "label", widget: "string" }
          - label: "Quy trình làm việc"
            name: "process"
            widget: "list"
            fields:
              - { label: "Bước", name: "step", widget: "string" }
              - { label: "Tiêu đề", name: "title", widget: "string" }
              - { label: "Mô tả", name: "desc", widget: "text" }

  - name: "services"
    label: "🛠️ Dịch vụ"
    files:
      - name: "services"
        label: "Danh sách dịch vụ"
        file: "content/services.json"
        fields:
          - label: "Dịch vụ"
            name: "items"
            widget: "list"
            fields:
              - { label: "Tiêu đề", name: "title", widget: "string" }
              - { label: "Phụ đề", name: "subtitle", widget: "string" }
              - { label: "Icon (Font Awesome)", name: "icon", widget: "string", hint: "fa-passport, fa-building, fa-id-card..." }
              - { label: "Màu", name: "color", widget: "select", options: ["blue", "green"] }
              - label: "Các mục con"
                name: "items"
                widget: "list"
                field: { label: "Mục", name: "item", widget: "string" }

  - name: "cases"
    label: "🏆 Hồ sơ thành công"
    files:
      - name: "cases"
        label: "Danh sách case"
        file: "content/cases.json"
        fields:
          - label: "Case"
            name: "items"
            widget: "list"
            fields:
              - { label: "Tiêu đề", name: "title", widget: "string" }
              - { label: "Mô tả", name: "description", widget: "text" }
              - { label: "Tag (loại hồ sơ)", name: "tag", widget: "string" }
              - { label: "Thời gian xử lý", name: "duration", widget: "string" }
              - { label: "Kết quả", name: "result", widget: "string", default: "Thành công" }
              - { label: "Ảnh minh họa", name: "image", widget: "image", required: false }

  - name: "testimonials"
    label: "💬 Đánh giá khách hàng"
    files:
      - name: "testimonials"
        label: "Danh sách đánh giá"
        file: "content/testimonials.json"
        fields:
          - label: "Đánh giá"
            name: "items"
            widget: "list"
            fields:
              - { label: "Tên khách hàng", name: "name", widget: "string" }
              - { label: "Chức danh / Vai trò", name: "role", widget: "string" }
              - { label: "Nội dung", name: "text", widget: "text" }
